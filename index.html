<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet JS - Flores Timur</title>
    <!-- Bootstrap CSS 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <!-- Leaflet Awesome Markers CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css">

    <style>
        html,
        body,
        #map {
            width: 100%;
            height: calc(100vh - 56px);
            margin: 0;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Flores Timur</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="https://sv.ugm.ac.id/" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-link"></i> SV UGM</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#aboutModal"><i
                                class="fa-solid fa-circle-info"></i> About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Modal About -->
    <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="aboutModalLabel">About</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-borderless m-0">
                        <tbody>
                            <tr>
                                <th scope="row" style="width: 80px;">Nama</th>
                                <td>: Indah Cahya Novianti</td>
                            </tr>
                            <tr>
                                <th scope="row">NIM</th>
                                <td>: 25/565798/SV/26994</td>
                            </tr>
                            <tr>
                                <th scope="row">Kelas</th>
                                <td>: A</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Jumlah Penduduk -->
    <div class="modal fade" id="pendudukModal" tabindex="-1" aria-labelledby="pendudukModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h1 class="modal-title fs-5" id="pendudukModalLabel"><i class="fa-solid fa-map-location-dot"></i> Informasi Kecamatan</h1>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="pendudukModalBody">
                    <!-- Dynamic Content -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- JavaScript Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Awesome Markers JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>

    <script>
        // Inisialisasi peta
        var map = L.map("map").setView([-8.3269522, 123.0156120], 11);

        // Custom Map Panes untuk Urutan Layer
        map.createPane("jumlah_penduduk_pane");
        map.getPane("jumlah_penduduk_pane").style.zIndex = 300;

        map.createPane("jalan_pane");
        map.getPane("jalan_pane").style.zIndex = 400;

        // Base Map
        var basemap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // GeoJSON Point Toponimi Menggunakan Leaflet.awesome-markers berdasarkan NAMA_UNSUR
        var toponimi = L.geoJSON(null, {
            pointToLayer: function (feature, latlng) {
                var unsur = (feature.properties.NAMA_UNSUR || "").toString().toLowerCase();
                var iconName = "location-dot";
                var markerColor = "purple";

                if (unsur.includes("gunung")) {
                    iconName = "mountain";
                    markerColor = "red";
                } else if (unsur.includes("tanjung")) {
                    iconName = "water";
                    markerColor = "orange";
                } else if (unsur.includes("teluk")) {
                    iconName = "anchor";
                    markerColor = "cadetblue";
                } else {
                    iconName = "house";
                    markerColor = "purple";
                }

                return L.marker(latlng, {
                    icon: L.AwesomeMarkers.icon({
                        icon: iconName,
                        prefix: "fa",
                        markerColor: markerColor,
                        iconColor: "white"
                    })
                });
            },
            onEachFeature: function (feature, layer) {
                var imgTag = feature.properties.image
                    ? "<div class='text-center mt-2'><img src='images/" + feature.properties.image + "' alt='" + feature.properties.TOPONIMI + "' style='max-width:100%; height:auto; max-height:160px; border-radius:4px;'/></div>"
                    : "";

                var popup_content = "<b>Nama:</b> " + feature.properties.TOPONIMI + "<br>" +
                    "<b>Kategori:</b> " + (feature.properties.NAMA_UNSUR || "-") + "<br>" +
                    "<b>Koordinat:</b> " + feature.geometry.coordinates[1].toFixed(6) + ", " + feature.geometry.coordinates[0].toFixed(6) +
                    imgTag;

                layer.bindPopup(popup_content);
                layer.bindTooltip(feature.properties.TOPONIMI, { direction: "left", sticky: true });
            }
        });

        $.getJSON("geojson/toponimi.geojson", function (data) {
            toponimi.addData(data);
            map.addLayer(toponimi);
        }).fail(function () {
            console.error("Gagal memuat geojson/toponimi.geojson");
        });

        // GeoJSON Polyline Jalan (Sesuai Ketentuan RBI & Pencarian Fleksibel)
        var jalan = L.geoJSON(null, {
            pane: "jalan_pane",
            style: function (feature) {
                var p = feature.properties;
                // Mengambil nilai atribut dari berbagai kemungkinan nama kolom di GeoJSON
                var val = (p.NAMA_UNSUR || p.KATEGORI || p.REMARK || p.KLASIFIKAS || p.JENIS || "").toString().toLowerCase();

                // 1. JALAN PROVINSI: Garis Merah Solid (Lurus Tebal)
                if (val.includes("provinsi") || val.includes("propinsi") || val.includes("arteri")) {
                    return {
                        color: "#D32F2F", // Merah
                        weight: 3,
                        opacity: 1,
                        pane: "jalan_pane"
                    };
                }
                // 2. JALAN KABUPATEN: Garis Merah Putus-Putus Jelas
                else if (val.includes("kabupaten") || val.includes("kolektor")) {
                    return {
                        color: "#D32F2F", // Merah
                        weight: 2,
                        dashArray: '12, 8', // Putus-putus Jelas (12px garis, 8px kosong)
                        opacity: 1,
                        pane: "jalan_pane"
                    };
                }
                // 3. JALAN LAIN / LOKAL: Garis Merah Putus-Putus
                else {
                    return {
                        color: "#C62828", // Merah
                        weight: 1.5,
                        dashArray: '8, 6', // Putus-putus Halus (8px garis, 6px kosong)
                        opacity: 1,
                        pane: "jalan_pane"
                    };
                }
            },
            onEachFeature: function (feature, layer) {
                var namaJalan = feature.properties.NAMA_UNSUR || feature.properties.REMARK || feature.properties.KATEGORI || "Jalan";
                var panjang = feature.properties.panjang_km ? feature.properties.panjang_km + " km" : "-";

                var popup_content = "<b>Fungsi Jalan:</b> " + namaJalan + "<br>" +
                    "<b>Panjang:</b> " + panjang;

                layer.bindPopup(popup_content);
                layer.bindTooltip(namaJalan, { direction: "auto", sticky: true });
            }
        });

        $.getJSON("geojson/jalan.geojson", function (data) {
            jalan.addData(data);
            map.addLayer(jalan);
        }).fail(function () {
            console.error("Gagal memuat geojson/jalan.geojson");
        });

        // GeoJSON Polygon Jumlah Penduduk
        var jumlah_penduduk = L.geoJSON(null, {
            pane: "jumlah_penduduk_pane",
            style: function (feature) {
                var p = feature.properties.Penduduk;
                var fillColor = p <= 12000 ? '#ffffb2' : p <= 24000 ? '#fd8d3c' : '#bd0026';
                return {
                    opacity: 1,
                    color: '#333333',
                    weight: 1.0,
                    fillOpacity: 0.7,
                    fillColor: fillColor,
                    pane: "jumlah_penduduk_pane"
                };
            },
            onEachFeature: function (feature, layer) {
                layer.on({
                    click: function () {
                        var formattedPenduduk = feature.properties.Penduduk
                            ? Number(feature.properties.Penduduk).toLocaleString('id-ID')
                            : "-";
                        var luas = feature.properties.luas_km2
                            ? Number(feature.properties.luas_km2).toFixed(2) + " km&sup2;"
                            : "-";

                        var modalHtml = `
                            <table class="table table-bordered table-striped m-0">
                                <tbody>
                                    <tr>
                                        <th style="width: 40%;"><i class="fa-solid fa-city"></i> Kecamatan</th>
                                        <td>${feature.properties.WADMKC || "-"}</td>
                                    </tr>
                                    <tr>
                                        <th><i class="fa-solid fa-landmark"></i> Kabupaten</th>
                                        <td>${feature.properties.WADMKK || "Flores Timur"}</td>
                                    </tr>
                                    <tr>
                                        <th><i class="fa-solid fa-users"></i> Jumlah Penduduk</th>
                                        <td><span class="badge bg-primary fs-6">${formattedPenduduk} Jiwa</span></td>
                                    </tr>
                                    <tr>
                                        <th><i class="fa-solid fa-chart-area"></i> Luas Wilayah</th>
                                        <td>${luas}</td>
                                    </tr>
                                </tbody>
                            </table>
                        `;

                        document.getElementById("pendudukModalLabel").innerHTML = `<i class="fa-solid fa-map-location-dot"></i> Kecamatan ` + (feature.properties.WADMKC || "");
                        document.getElementById("pendudukModalBody").innerHTML = modalHtml;

                        var pendudukModal = new bootstrap.Modal(document.getElementById("pendudukModal"));
                        pendudukModal.show();
                    }
                });

                layer.bindTooltip(feature.properties.WADMKC, { direction: "auto", sticky: true });
            }
        });

        $.getJSON("geojson/jumlah_penduduk.geojson", function (data) {
            jumlah_penduduk.addData(data);
            map.addLayer(jumlah_penduduk);
        }).fail(function () {
            console.error("Gagal memuat geojson/jumlah_penduduk.geojson");
        });

        // Base Maps
        var baseMaps = {
            "OpenStreetMap": basemap
        };

        // Label Legenda Jalan Menggunakan SVG (Menggambarkan Garis Solid & Putus-Putus dengan Akurat)
        var labelJalan = "<b>Jaringan Jalan</b><br><span style='display: block; padding-left: 18px; font-size: 12px; line-height: 1.8; margin-top: 4px;'>" +
            "<span style='display: flex; align-items: center; margin-bottom: 2px;'><svg width='24' height='10' style='margin-right:6px;'><line x1='0' y1='5' x2='24' y2='5' stroke='#D32F2F' stroke-width='4'/></svg> Jalan Provinsi</span>" +
            "<span style='display: flex; align-items: center; margin-bottom: 2px;'><svg width='24' height='10' style='margin-right:6px;'><line x1='0' y1='5' x2='24' y2='5' stroke='#F57C00' stroke-width='3' stroke-dasharray='6, 4'/></svg> Jalan Kabupaten</span>" +
            "<span style='display: flex; align-items: center;'><svg width='24' height='10' style='margin-right:6px;'><line x1='0' y1='5' x2='24' y2='5' stroke='#C62828' stroke-width='2' stroke-dasharray='4, 4'/></svg> Jalan Lain</span>" +
            "</span>";

        // Label Legenda Jumlah Penduduk
        var labelJumlahPenduduk = "<b>Jumlah Penduduk</b><br><span style='display: block; padding-left: 18px; font-size: 12px; line-height: 1.8; margin-top: 4px;'>" +
            "<span style='display: flex; align-items: center;'><span style='display: inline-block; width: 14px; height: 14px; background-color: #ffffb2; border: 1px solid black; margin-right: 6px;'></span> &le; 12.000 Jiwa</span>" +
            "<span style='display: flex; align-items: center;'><span style='display: inline-block; width: 14px; height: 14px; background-color: #fd8d3c; border: 1px solid black; margin-right: 6px;'></span> 12.001 - 24.000 Jiwa</span>" +
            "<span style='display: flex; align-items: center;'><span style='display: inline-block; width: 14px; height: 14px; background-color: #bd0026; border: 1px solid black; margin-right: 6px;'></span> &gt; 24.000 Jiwa</span>" +
            "</span>";

        // Label Legenda Toponimi
        var labelToponimi = "<b>Toponimi</b><br><span style='display: block; padding-left: 18px; font-size: 12px; line-height: 1.8; margin-top: 4px;'>" +
            "<span style='display: flex; align-items: center; margin-bottom: 2px;'><i class='fa-solid fa-mountain' style='color:#d9534f; width:16px; margin-right:6px;'></i> Gunung</span>" +
            "<span style='display: flex; align-items: center; margin-bottom: 2px;'><i class='fa-solid fa-water' style='color:#f0ad4e; width:16px; margin-right:6px;'></i> Tanjung</span>" +
            "<span style='display: flex; align-items: center; margin-bottom: 2px;'><i class='fa-solid fa-anchor' style='color:#5bc0de; width:16px; margin-right:6px;'></i> Teluk</span>" +
            "<span style='display: flex; align-items: center;'><i class='fa-solid fa-house' style='color:#9b59b6; width:16px; margin-right:6px;'></i> Pemukiman / Lainnya</span>" +
            "</span>";

        // Overlay Maps
        var overlayMaps = {};
        overlayMaps[labelToponimi] = toponimi;
        overlayMaps[labelJalan] = jalan;
        overlayMaps[labelJumlahPenduduk] = jumlah_penduduk;

        // Control Layer
        var controllayer = L.control.layers(baseMaps, overlayMaps, { collapsed: true }).addTo(map);
    </script>
</body>

</html>
